<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CurbCall — Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0f18;--surface:#13162a;--card:#1c2035;--border:#2a2f4a;--accent:#f59e0b;
 --green:#22c55e;--red:#ef4444;--text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
 --ui:'Segoe UI',system-ui,sans-serif;--mono:'SF Mono',Consolas,monospace;}
body{font-family:var(--ui);background:var(--bg);color:var(--text);padding:1rem;max-width:900px;margin:0 auto;}
h1{font-size:1.4rem;margin-bottom:0.2rem;}
h1 span{color:var(--accent);}
h2{font-size:0.95rem;color:var(--accent);text-transform:uppercase;letter-spacing:0.05em;margin:1.6rem 0 0.7rem;}
.sub{color:var(--text2);font-size:0.85rem;margin-bottom:1.2rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:0.8rem;}
label{display:block;color:var(--text2);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin:0.7rem 0 0.3rem;}
input,select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;
 padding:0.7rem 0.8rem;color:var(--text);font-size:0.95rem;font-family:var(--ui);}
input:focus,select:focus{outline:none;border-color:var(--accent);}
button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:0.7rem 1rem;
 font-size:0.9rem;font-weight:700;cursor:pointer;font-family:var(--ui);margin-top:0.8rem;}
button.ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
button.danger{background:var(--red);color:#fff;}
.row{display:flex;gap:0.6rem;flex-wrap:wrap;}
.row>*{flex:1;min-width:120px;}
.stats{display:flex;gap:0.6rem;flex-wrap:wrap;}
.stat{flex:1;min-width:90px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.8rem;text-align:center;}
.stat .n{font-size:1.6rem;font-weight:800;}
.stat .l{font-size:0.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-top:0.2rem;}
table{width:100%;border-collapse:collapse;font-size:0.8rem;}
th{text-align:left;color:var(--text3);font-size:0.66rem;text-transform:uppercase;letter-spacing:0.04em;padding:0.4rem 0.5rem;border-bottom:1px solid var(--border);}
td{padding:0.5rem;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top;}
td.key{font-family:var(--mono);font-size:0.72rem;color:var(--text);word-break:break-all;}
.tag{display:inline-block;font-size:0.64rem;font-weight:700;padding:0.15rem 0.45rem;border-radius:10px;}
.tag.ok{background:#052e16;color:var(--green);}
.tag.off{background:#3a0a0a;color:var(--red);}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.msg{font-size:0.85rem;margin-top:0.6rem;min-height:1.1rem;}
.msg.ok{color:var(--green);}
.msg.err{color:var(--red);}
.keybox{font-family:var(--mono);font-size:0.85rem;background:var(--surface);border:1px dashed var(--accent);
 border-radius:8px;padding:0.7rem;margin-top:0.7rem;word-break:break-all;display:none;}
.mini{background:none;border:1px solid var(--border);color:var(--text2);padding:0.3rem 0.6rem;font-size:0.7rem;margin:0;border-radius:6px;}
.hide{display:none;}
</style>
</head>
<body>
<h1>Curb<span>Call</span> · Admin</h1>
<div class="sub">Issue and revoke keys, and see who's trialing or subscribed.</div>

<div class="card" id="auth-card">
  <label>Admin token</label>
  <input id="token" type="password" placeholder="your ADMIN_TOKEN" />
  <button id="login-btn">Connect</button>
  <div class="msg" id="auth-msg"></div>
</div>

<div id="panel" class="hide">
  <div class="stats" id="stats"></div>

  <h2>Issue a key</h2>
  <div class="card">
    <div class="row">
      <div>
        <label>Plan</label>
        <select id="issue-plan"><option value="monthly">Monthly (30 days)</option><option value="annual">Annual (365 days)</option></select>
      </div>
      <div>
        <label>Email (optional)</label>
        <input id="issue-email" type="email" placeholder="customer@email.com" />
      </div>
    </div>
    <button id="issue-btn">Generate Key</button>
    <div class="msg" id="issue-msg"></div>
    <div class="keybox" id="issue-key"></div>
  </div>

  <h2>Revoke a key</h2>
  <div class="card">
    <label>License key</label>
    <input id="revoke-key" placeholder="BCP-..." />
    <button class="danger" id="revoke-btn">Revoke Key</button>
    <div class="msg" id="revoke-msg"></div>
  </div>

  <h2>Subscribers <button class="mini" id="refresh-btn">Refresh</button></h2>
  <div class="card scroll">
    <table id="issued-table"><thead><tr><th>Key</th><th>Email</th><th>Plan</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
    <div class="sub" id="issued-empty" style="margin:0.6rem 0 0;"></div>
  </div>

  <h2>Trials</h2>
  <div class="card scroll">
    <table id="trials-table"><thead><tr><th>Device</th><th>Started</th><th>Expires</th><th>Status</th></tr></thead><tbody></tbody></table>
    <div class="sub" id="trials-empty" style="margin:0.6rem 0 0;"></div>
  </div>
</div>

<script>
const SERVER = "https://bid-caller-pro.onrender.com";
const $ = id => document.getElementById(id);
function token(){ return localStorage.getItem("admin_token") || ""; }

async function post(path, extra){
  const r = await fetch(SERVER + path, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({ admin_token: token() }, extra || {}))
  });
  return { status:r.status, data: await r.json().catch(()=>({})) };
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$("login-btn").onclick = async () => {
  const t = $("token").value.trim();
  if(!t){ $("auth-msg").textContent="Enter the token"; $("auth-msg").className="msg err"; return; }
  localStorage.setItem("admin_token", t);
  const res = await load();
  if(res){ $("auth-card").classList.add("hide"); $("panel").classList.remove("hide"); }
};

async function load(){
  const { status, data } = await post("/admin/list");
  if(status === 401){ $("auth-msg").textContent="Wrong token."; $("auth-msg").className="msg err"; localStorage.removeItem("admin_token"); return false; }
  if(!data.ok){ $("auth-msg").textContent="Couldn't load (server reachable?)."; $("auth-msg").className="msg err"; return false; }
  renderStats(data.counts);
  renderIssued(data.issued || []);
  renderTrials(data.trials || []);
  return true;
}

function renderStats(c){
  c = c || {};
  $("stats").innerHTML = `
    <div class="stat"><div class="n" style="color:var(--green)">${c.active_subs||0}</div><div class="l">Active subs</div></div>
    <div class="stat"><div class="n" style="color:var(--accent)">${c.active_trials||0}</div><div class="l">Active trials</div></div>
    <div class="stat"><div class="n">${c.issued||0}</div><div class="l">Keys issued</div></div>
    <div class="stat"><div class="n" style="color:var(--red)">${c.revoked||0}</div><div class="l">Revoked</div></div>`;
}

function renderIssued(list){
  const tb = $("issued-table").querySelector("tbody");
  $("issued-empty").textContent = list.length ? "" : "No keys issued yet.";
  tb.innerHTML = list.map(i => `<tr>
    <td class="key">${esc(i.key)}</td>
    <td>${esc(i.email)||"\u2014"}</td>
    <td>${esc(i.plan)}</td>
    <td>${esc(i.expires)}</td>
    <td>${i.revoked?'<span class="tag off">revoked</span>':'<span class="tag ok">active</span>'}</td>
    <td>${i.revoked?'':`<button class="mini" data-revoke="${esc(i.key)}">Revoke</button>`}</td>
  </tr>`).join("");
  tb.querySelectorAll("[data-revoke]").forEach(b => b.onclick = () => doRevoke(b.dataset.revoke));
}

function renderTrials(list){
  const tb = $("trials-table").querySelector("tbody");
  $("trials-empty").textContent = list.length ? "" : "No trials yet.";
  tb.innerHTML = list.map(t => `<tr>
    <td class="key">${esc(t.device)}</td>
    <td>${esc(t.started)}</td>
    <td>${esc(t.expires)}</td>
    <td>${t.active?`<span class="tag ok">${t.days_left}d left</span>`:'<span class="tag off">expired</span>'}</td>
  </tr>`).join("");
}

$("issue-btn").onclick = async () => {
  const plan = $("issue-plan").value;
  const email = $("issue-email").value.trim();
  $("issue-msg").textContent = "Generating...";
  $("issue-msg").className = "msg";
  const { data } = await post("/issue", { plan, email });
  if(data.ok){
    $("issue-msg").textContent = "Key created" + (email?` and ready for ${email}`:"") + ":";
    $("issue-msg").className = "msg ok";
    const box = $("issue-key");
    box.textContent = data.key; box.style.display = "block";
    box.onclick = () => { navigator.clipboard?.writeText(data.key); $("issue-msg").textContent = "Copied to clipboard."; };
    $("issue-email").value = "";
    load();
  } else {
    $("issue-msg").textContent = "Failed: " + (data.reason || "error");
    $("issue-msg").className = "msg err";
  }
};

async function doRevoke(key){
  if(!confirm("Revoke this key? The user loses access immediately.")) return;
  const { data } = await post("/revoke", { key });
  if(data.ok){ load(); } else { alert("Revoke failed: " + (data.reason||"error")); }
}

$("revoke-btn").onclick = async () => {
  const key = $("revoke-key").value.trim();
  if(!key){ $("revoke-msg").textContent="Enter a key"; $("revoke-msg").className="msg err"; return; }
  if(!confirm("Revoke this key?")) return;
  const { data } = await post("/revoke", { key });
  if(data.ok){ $("revoke-msg").textContent="Revoked."; $("revoke-msg").className="msg ok"; $("revoke-key").value=""; load(); }
  else { $("revoke-msg").textContent="Failed: "+(data.reason||"error"); $("revoke-msg").className="msg err"; }
};

$("refresh-btn").onclick = load;

// auto-connect if token already saved
if(token()){
  load().then(ok => { if(ok){ $("auth-card").classList.add("hide"); $("panel").classList.remove("hide"); } });
}
</script>
</body>
</html>
