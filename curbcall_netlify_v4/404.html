<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found &mdash; CurbCall Pro</title>
<meta name="theme-color" content="#0b0d14" />
<meta name="robots" content="noindex" />
<style>
/* Standalone on purpose. The landing page's CSS is inline in its own <head>,
   and a 404 that depends on another file is a 404 that can render unstyled
   at exactly the moment something is already wrong. */
:root{
  --bg:#0b0d14; --card:#121628; --line:#2a2f4a;
  --amber:#f59e0b; --amber-d:#d97706;
  --text:#f1f5f9; --text2:#9aa4ba; --text3:#5b6479;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:1.5rem;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:30rem;width:100%;text-align:center;}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:2rem;}
.logo span{color:var(--amber);}
.code{font-size:3.5rem;font-weight:800;line-height:1;color:var(--amber);margin-bottom:0.6rem;}
h1{font-size:1.35rem;font-weight:700;margin:0 0 0.7rem;}
p{color:var(--text2);margin:0 0 1.6rem;}
.row{display:flex;gap:0.7rem;flex-wrap:wrap;justify-content:center;}
.btn{
  display:inline-block;padding:0.85rem 1.4rem;border-radius:0.6rem;
  font-weight:700;text-decoration:none;font-size:0.98rem;
}
.btn-amber{background:var(--amber);color:#10131c;}
.btn-amber:hover{background:var(--amber-d);}
.btn-line{border:1px solid var(--line);color:var(--text);}
.btn-line:hover{border-color:var(--text3);}
.foot{margin-top:2rem;font-size:0.9rem;color:var(--text3);}
.foot a{color:var(--text2);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Curb<span>Call</span></div>
    <div class="code">404</div>
    <h1>That page isn't here</h1>
    <p>The link may be mistyped or out of date. Everything still works &mdash;
       start from the home page and check your area.</p>
    <div class="row">
      <a class="btn btn-amber" href="/">Go to the home page</a>
      <a class="btn btn-line" href="/app.html">Open the app</a>
    </div>
    <div class="foot">
      Think this is our mistake?
      <a href="mailto:support@curbcallpro.com">support@curbcallpro.com</a>
    </div>
  </div>
</body>
</html>
